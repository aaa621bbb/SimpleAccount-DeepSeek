plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.simpleaccount.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.simpleaccount.app"
        minSdk 26
        targetSdk 34
        versionCode 38
        versionName "2.21.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // 固定 debug 签名：优先用项目内 debug.keystore（保证每次构建签名一致，可直接覆盖安装）。
        // CI 或首次 checkout 无该文件时自动回退到系统默认 debug 签名，避免构建失败。
        debug {
            def keystoreFile = file('debug.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "simpleaccount"
                keyAlias "simpleaccount"
                keyPassword "simpleaccount"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 与 debug 共用固定签名：release 包也能直接覆盖安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.10'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/versions/**',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.50'
    kapt 'com.google.dagger:hilt-android-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // POI for xlsx — keep xmlbeans (needed to parse xlsx); drop logging to reduce size
    // POI for xlsx。注意：不要排除 org.apache.logging.log4j —— POI 的 IOUtils 静态初始化
    // 依赖 log4j-api 的 LogManager，排除会抛 NoClassDefFoundError: org/apache/logging/log4j/LogManager（xlsx 解析闪退）。
    implementation('org.apache.poi:poi:5.2.5') {
        exclude group: 'commons-logging'
    }
    implementation('org.apache.poi:poi-ooxml:5.2.5') {
        exclude group: 'commons-logging'
    }
    // POI 运行时传递依赖：Android 构建不会自动全量带入 POI 的 pom 运行时依赖，
    // 缺这些类会在解析 xlsx 时抛 NoClassDefFoundError（如 org/apache/poi/util/IOUtils、commons-io）。
    implementation 'commons-io:commons-io:2.15.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-compress:1.25.0'
    implementation 'com.github.virtuald:curvesapi:1.08'
    implementation 'com.zaxxer:SparseBitSet:1.3'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'org.apache.xmlbeans:xmlbeans:5.2.0'
    // POI 日志门面：IOUtils 静态初始化需要 log4j-api（不含 core，纯门面，体积小）
    implementation 'org.apache.logging.log4j:log4j-api:2.21.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JSON
    implementation 'org.json:json:20240303'

    // Network (for AI)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
